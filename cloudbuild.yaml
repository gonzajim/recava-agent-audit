# =====================================================================================
# cloudbuild.yaml Parametrizado para Entornos PROD y DEV
# =====================================================================================
# Optimizaciones de build time:
#  - DOCKER_BUILDKIT=1 + BUILDKIT_INLINE_CACHE=1: cache por capas embebido en la imagen.
#    Builds con cache caliente (sin cambios en requirements.txt): ~3-5 min.
#  - Dockerfile separa torch CPU-only (~200MB) del resto: requirements.txt puede
#    cambiar sin re-descargar torch.
#  - Digest fijado en FROM del builder: Docker Hub no invalida el cache entre builds.
# =====================================================================================

steps:
  # -------------------------------------------------------------------------------------
  # PASO 1a: Build de la imagen Docker con BuildKit + cache embebido
  # -------------------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build-Backend-Image'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      - '--cache-from'
      - 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:latest'
      - '-t'
      - 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:latest'
      - '.'

  # -------------------------------------------------------------------------------------
  # PASO 1b: Push de la imagen (actualiza :latest con metadata de cache BuildKit)
  # -------------------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push-Backend-Image'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:latest'
    waitFor: ['Build-Backend-Image']

  # -------------------------------------------------------------------------------------
  # PASO 1c: Desplegar el Backend en Cloud Run
  # -------------------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy-Backend-to-Cloud-Run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:latest'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--project'
      - '${PROJECT_ID}'
      - '--update-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,PINECONE_API_KEY=PINECONE_API_KEY:latest,PINECONE_INDEX_NAME=PINECONE_INDEX_NAME:latest,BIGQUERY_DATASET_ID=BIGQUERY_DATASET_ID:latest,BIGQUERY_TABLE_ID=BIGQUERY_TABLE_ID:latest,NEO4J_PASSWORD=NEO4J_PASSWORD:latest'
      - '--set-env-vars=EMBEDDING_MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2,NEO4J_URI=neo4j+s://273d9982.databases.neo4j.io,NEO4J_USERNAME=273d9982,NEO4J_DATABASE=273d9982'
      - '--timeout=600s'
      - '--concurrency=40'
      - '--cpu=2'
      - '--memory=4Gi'
    waitFor: ['Push-Backend-Image']

  # -------------------------------------------------------------------------------------
  # PASO 2: Instalar Firebase Tools
  # -------------------------------------------------------------------------------------
  - name: 'node:18'
    id: 'Install-Firebase-Tools'
    entrypoint: 'npm'
    args: ['install', 'firebase-tools']

  # -------------------------------------------------------------------------------------
  # PASO 3: Construir el Frontend (Admin Panel)
  # -------------------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/npm'
    id: 'Install-Admin-Panel-Dependencies'
    args: ['install']
    dir: 'public/admin-panel'

  - name: 'gcr.io/cloud-builders/npm'
    id: 'Build-Admin-Panel'
    args: ['run', 'build']
    dir: 'public/admin-panel'
    waitFor: ['Install-Admin-Panel-Dependencies']

  # -------------------------------------------------------------------------------------
  # PASO 4: Desplegar el Frontend en Firebase Hosting
  # TODO: migrar a FIREBASE_CI_TOKEN (ver comentario en README).
  # allowFailure: true → el backend se despliega aunque Firebase falle.
  # -------------------------------------------------------------------------------------
  - name: 'node:18'
    id: 'Deploy-Frontend-to-Firebase'
    entrypoint: './node_modules/.bin/firebase'
    args:
      - 'deploy'
      - '--project'
      - '${_FIREBASE_PROJECT_ALIAS}'
      - '--only'
      - 'hosting'
      - '--force'
    allowFailure: true
    waitFor: ['Install-Firebase-Tools', 'Build-Admin-Panel']

# =====================================================================================
# Variables con valores por defecto para producción
# =====================================================================================
substitutions:
  _SERVICE_NAME: 'orchestrator'
  _FIREBASE_PROJECT_ALIAS: 'prod'

images:
  - 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:latest'

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
