# =====================================================================================
# cloudbuild.yaml Parametrizado para Entornos PROD y DEV - Versión Final Corregida
# =====================================================================================
# Este archivo es una receta ÚNICA. Los triggers de Cloud Build le pasarán
# las variables _SERVICE_NAME y _FIREBASE_PROJECT_ALIAS para dirigir el despliegue
# al entorno correcto (Producción o Desarrollo).
# =====================================================================================

steps:
  # -------------------------------------------------------------------------------------
  # PASO 1a: Build de la imagen Docker con caché de capas
  # Usa --cache-from con :latest para reutilizar capas del build anterior.
  # La capa pip install (sentence-transformers ~2 GB) queda cacheada si
  # requirements.txt no cambió → de 8 min a <1 min en builds típicos.
  # -------------------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build-Backend-Image'
    args:
      - 'build'
      - '--cache-from'
      - 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:latest'
      - '-t'
      - 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:latest'
      - '.'

  # -------------------------------------------------------------------------------------
  # PASO 1b: Push de la imagen (también actualiza :latest para el próximo cache)
  # -------------------------------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push-Backend-Image'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:latest'
    waitFor: ['Build-Backend-Image']

  # -------------------------------------------------------------------------------------
  # PASO 1c: Desplegar el Backend en Cloud Run usando la imagen ya construida
  # -------------------------------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy-Backend-to-Cloud-Run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:latest'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--project'
      - '${PROJECT_ID}'
      - '--update-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,PINECONE_API_KEY=PINECONE_API_KEY:latest,PINECONE_INDEX_NAME=PINECONE_INDEX_NAME:latest,BIGQUERY_DATASET_ID=BIGQUERY_DATASET_ID:latest,BIGQUERY_TABLE_ID=BIGQUERY_TABLE_ID:latest'
      - '--set-env-vars=EMBEDDING_MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2'
      - '--timeout=600s'
      - '--concurrency=40'
      - '--cpu=2'
      - '--memory=4Gi'
    waitFor: ['Push-Backend-Image']

  # -------------------------------------------------------------------------------------
  # PASO 2: Instalar las herramientas de Firebase
  # -------------------------------------------------------------------------------------
  - name: 'node:18'
    id: 'Install-Firebase-Tools'
    entrypoint: 'npm'
    args: ['install', 'firebase-tools']

  # -------------------------------------------------------------------------------------
  # PASO 3: Construir el Frontend (Admin Panel)
  # -------------------------------------------------------------------------------------
  # Instala las dependencias del panel de administración
  - name: 'gcr.io/cloud-builders/npm'
    id: 'Install-Admin-Panel-Dependencies'
    args: ['install']
    dir: 'public/admin-panel' # Ejecuta el comando en este directorio

  # Compila la aplicación de React y crea la carpeta 'build'
  - name: 'gcr.io/cloud-builders/npm'
    id: 'Build-Admin-Panel'
    args: ['run', 'build']
    dir: 'public/admin-panel' # Ejecuta el comando en este directorio
    waitFor: ['Install-Admin-Panel-Dependencies']

  # -------------------------------------------------------------------------------------
  # PASO 4: Desplegar el Frontend en Firebase Hosting
  # -------------------------------------------------------------------------------------
  - name: 'node:18'
    id: 'Deploy-Frontend-to-Firebase'
    entrypoint: './node_modules/.bin/firebase'
    args:
      - 'deploy'
      - '--project'
      - '${_FIREBASE_PROJECT_ALIAS}'
      - '--only'
      - 'hosting'
      - '--force'
    # Espera a que las herramientas de Firebase estén instaladas Y el panel de admin esté construido
    waitFor: ['Install-Firebase-Tools', 'Build-Admin-Panel']

# =====================================================================================
# Definición de las variables con valores POR DEFECTO para el entorno de producción.
# =====================================================================================
substitutions:
  _SERVICE_NAME: 'orchestrator'
  _FIREBASE_PROJECT_ALIAS: 'prod'

images:
  - 'europe-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:latest'

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
